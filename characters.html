<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Characters - Animalia</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
    <div class="container px-5">
        <a class="navbar-brand" href="index.html">Animalia</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Story</a></li>
                <li class="nav-item"><a class="nav-link active" href="characters.html">Characters</a></li>
                <li class="nav-item"><a class="nav-link" href="news.html">News</a></li>
                <li class="nav-item"><a class="nav-link" href="media.html">Media</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Header -->
<header class="masthead text-center text-white">
    <div class="masthead-content">
        <div class="container px-5">
            <h2 class="masthead-subheading mb-0">Discover the Characters of Animalia!</h2>
        </div>
    </div>
</header>
<!-- Characters Carousel -->
<section class="content-section">
    <div class="container px-5">
        <br>
        <div id="characterCarousel" class="carousel slide" data-bs-interval="false">
            <div class="carousel-inner">
                <!-- Character 1 -->
                <div class="carousel-item active">
                    <div class="d-flex flex-column align-items-center">
                        <img src="assets/img/Cheetah_Suit1.png" class="d-block img-fluid rounded" alt="Cheetah">
                        <h5 class="mt-3">Cheetah</h5>
                        <a href="cheetah.html" class="btn btn-primary mt-2">View Profile</a>
                    </div>
                </div>
                <!-- Character 2 -->
                <div class="carousel-item">
                    <div class="d-flex flex-column align-items-center">
                        <img src="assets/img/bunny2.png" class="d-block img-fluid rounded" alt="Lion">
                        <h5 class="mt-3">Bunny</h5>
                        <a href="bunny.html" class="btn btn-primary mt-2">View Profile</a>
                    </div>
                </div>
                <!-- Character 3 -->
                <div class="carousel-item">
                    <div class="d-flex flex-column align-items-center">
                        <img src="assets/img/squid.png" class="d-block img-fluid rounded" alt="Bunny">
                        <h5 class="mt-3">Squid</h5>
                        <a href="squid.html" class="btn btn-primary mt-2">View Profile</a>
                    </div>
                </div>
            </div>
            <!-- Carousel Controls -->
            <button class="carousel-control-prev" type="button" data-bs-target="#characterCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#characterCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="py-5 bg-black">
    <div class="container px-5">
        <p class="m-0 text-center text-white small">Copyright &copy; Animalia 2025</p>
    </div>
</footer>

<!-- Bootstrap core JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Core theme JS -->
<script src="js/scripts.js"></script>
</body>
</html>
